<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MinecrafTG - Professional Mini App</title>
    <!-- Fuentes Profesionales -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --mc-green: #5b8731;
            --mc-dark-green: #38561c;
            --mc-dirt: #866043;
            --mc-stone: #737373;
            --mc-gold: #f4c430;
            --mc-diamond: #4deeea;
            --mc-bg: #0b0d10;
            --mc-card-bg: rgba(20, 25, 33, 0.95);
            --mc-border: #334155;
            --mc-text: #f8fafc;
            --mc-red: #ef4444;
            --mc-gold-glow: 0 0 25px rgba(244, 196, 48, 0.6);
            --mc-diamond-glow: 0 0 25px rgba(77, 238, 234, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--mc-bg);
            color: var(--mc-text);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 15%, rgba(91, 135, 49, 0.2) 0%, transparent 65%),
                linear-gradient(135deg, #090b0e 0%, #111827 100%);
        }

        /* --- PANTALLA DE CARGA ÉPICA --- */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #090b0e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .splash-logo {
            font-family: 'Press Start 2P', monospace;
            font-size: 1.5rem;
            color: var(--mc-gold);
            text-shadow: 0 0 15px rgba(244, 196, 48, 0.5);
            margin-bottom: 20px;
            text-align: center;
        }

        .progress-bar-container {
            width: 80%;
            max-width: 300px;
            height: 20px;
            background: var(--mc-border);
            border: 2px solid var(--mc-stone);
            padding: 2px;
            border-radius: 4px;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--mc-green);
            width: 0%;
            transition: width 0.2s ease;
        }

        /* Contenedor Principal de la App */
        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 900px;
            background: var(--mc-card-bg);
            border: 1px solid var(--mc-border);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        @media(min-width: 481px) {
            .app-container {
                border-radius: 20px;
                box-shadow: 0 20px 40px rgba(0,0,0,0.6);
                height: 85vh;
            }
        }

        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 90px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Barra de Navegación Inferior */
        .nav-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: rgba(11, 13, 16, 0.95);
            border-top: 1px solid var(--mc-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--mc-stone);
            font-size: 1.2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-btn span {
            font-size: 0.65rem;
            font-family: 'Press Start 2P', monospace;
        }

        .nav-btn.active {
            color: var(--mc-gold);
            text-shadow: 0 0 10px rgba(244, 196, 48, 0.4);
        }

        .mc-card {
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid var(--mc-stone);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- PANTALLA DE CARGA -->
    <div id="splash-screen">
        <div class="splash-logo">MINECRAF-TG</div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
        <p style="margin-top: 15px; font-size: 0.8rem; color: var(--mc-stone);">Cargando bloques y texturas...</p>
    </div>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="app-container">
        <div class="content-area">
            
            <!-- Pestaña de Inicio -->
            <div id="tab-home" class="tab-content active">
                <div class="mc-card">
                    <h2 style="font-family: 'Press Start 2P'; font-size: 0.9rem; color: var(--mc-gold); margin-bottom: 10px;">Panel Principal</h2>
                    <p style="font-size: 0.9rem; line-height: 1.4;">Bienvenido a MinecrafTG. Selecciona un pico, mina recursos y genera recompensas en la red.</p>
                </div>
            </div>

            <!-- Pestaña de Picos (Mercado) -->
            <div id="tab-market" class="tab-content">
                <div class="mc-card">
                    <h2 style="font-family: 'Press Start 2P'; font-size: 0.9rem; color: var(--mc-gold); margin-bottom: 10px;">Mercado de Picos</h2>
                    <p style="font-size: 0.9rem;">Próximamente el catálogo completo de herramientas mineras.</p>
                </div>
            </div>

            <!-- Pestaña de Wallet -->
            <div id="tab-wallet" class="tab-content">
                <div class="mc-card">
                    <h2 style="font-family: 'Press Start 2P'; font-size: 0.9rem; color: var(--mc-gold); margin-bottom: 10px;">Caja Fuerte</h2>
                    <p style="font-size: 0.9rem;">Gestiona tus depósitos y retiros en USDT.</p>
                </div>
            </div>

        </div>

        <!-- BARRA DE NAVEGACIÓN -->
        <nav class="nav-bar">
            <button class="nav-btn active" onclick="switchTab('home')">
                <i class="fa-solid fa-house"></i>
                <span>Inicio</span>
            </button>
            <button class="nav-btn" onclick="switchTab('market')">
                <i class="fa-solid fa-hammer"></i>
                <span>Picos</span>
            </button>
            <button class="nav-btn" onclick="switchTab('wallet')">
                <i class="fa-solid fa-wallet"></i>
                <span>Wallet</span>
            </button>
        </nav>
    </div>

    <script>
        // Simulación de Pantalla de Carga
        let progress = 0;
        const progressInterval = setInterval(() => {
            progress += 15;
            document.getElementById('progress-fill').style.width = progress + '%';
            if (progress >= 100) {
                clearInterval(progressInterval);
                document.getElementById('splash-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('splash-screen').style.display = 'none';
                }, 400);
            }
        }, 120);

        // Sistema de Pestañas
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            
            if(tabName === 'home') {
                document.getElementById('tab-home').classList.add('active');
                event.currentTarget.classList.add('active');
            } else if(tabName === 'market') {
                document.getElementById('tab-market').classList.add('active');
                event.currentTarget.classList.add('active');
            } else if(tabName === 'wallet') {
                document.getElementById('tab-wallet').classList.add('active');
                event.currentTarget.classList.add('active');
            }
        }
    </script>
</body>
</html>
